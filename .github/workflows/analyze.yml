name: Analyze

# Fast feedback while the APK build is the slow one: the app's Dart source is
# type-checked in minutes instead of after a runtime download and Gradle run.
# workflow_dispatch and the `check` branch only; the APK workflow owns `build`.

on:
  workflow_dispatch:
  push:
    branches: [check]

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: flutter analyze
        working-directory: app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
