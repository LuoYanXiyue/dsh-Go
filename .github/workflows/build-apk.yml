name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [build]

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7
  NODE_VERSION: 24.22.1
  TZ: Asia/Shanghai

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      # libtawcroot.so is compiled by runtime/tawcroot/build.py, which refuses an
      # NDK other than the one its source.json pins; the runner's image does not
      # ship it, so install it beside the SDK the other tools come from.
      - name: Install the pinned NDK
        run: |
          yes | sdkmanager --install "ndk;28.2.13676358" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Build runtime
        run: bash runtime/build-runtime.sh arm64-v8a

      - name: Build APK
        env:
          DSH_BETA_TOKEN_FILE: ""
        run: bash tooling/build-apk.sh -f arm64 --no-companion --no-star --keep-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-arm64-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
